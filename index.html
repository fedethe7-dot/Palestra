<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>Palestra</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=5.1.1">
</head>
<body>
  <main id="app"></main>

  <nav id="nav">
    <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-view="allena"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Allena</button>
    <button data-view="ricette"><svg viewBox="0 0 24 24"><path d="M5 11h14a7 7 0 0 1-14 0zM12 3v3M8 4.5l1 2M16 4.5l-1 2M9 21h6"/></svg>Ricette</button>
    <button data-view="progressi"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/><circle cx="19" cy="6" r="1.2"/></svg>Progressi</button>
    <button data-view="corpo"><span class="nav-emo">💪</span>Corpo</button>
  </nav>

  <div id="toast"></div>
  <input type="file" id="file" accept=".json,.csv,text/csv,application/json" hidden>

  <script src="visual.js?v=5.1.1"></script>
  <script src="timer.js?v=5.1.1"></script>
  <script src="ricette.js?v=5.1.1"></script>
  <script src="stampa.js?v=5.1.1"></script>
  <script src="app.js?v=5.1.1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(r => r.update());
      // quando arriva una versione nuova, ricarica una volta da sola
      let ricaricata = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!ricaricata) { ricaricata = true; location.reload(); } });
    }
  </script>
</body>
</html>
